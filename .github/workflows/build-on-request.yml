name: Build Stack64 Windows Client

on:
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows client
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download and bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          Set-Location "$env:RUNNER_TEMP\vcpkg"
          git checkout 3b3bd424827a1f7f4813216f6b32b6c61e386b2e
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg.exe integrate install

      - name: Install OTCv8 dependencies
        shell: pwsh
        run: |
          $vcpkg = "$env:RUNNER_TEMP\vcpkg\vcpkg.exe"

          & $vcpkg install `
            boost-iostreams:x86-windows-static `
            boost-asio:x86-windows-static `
            boost-beast:x86-windows-static `
            boost-system:x86-windows-static `
            boost-variant:x86-windows-static `
            boost-lockfree:x86-windows-static `
            boost-process:x86-windows-static `
            boost-program-options:x86-windows-static `
            boost-uuid:x86-windows-static `
            boost-filesystem:x86-windows-static `
            luajit:x86-windows-static `
            glew:x86-windows-static `
            physfs:x86-windows-static `
            openal-soft:x86-windows-static `
            libogg:x86-windows-static `
            libvorbis:x86-windows-static `
            zlib:x86-windows-static `
            libzip:x86-windows-static `
            bzip2:x86-windows-static `
            openssl:x86-windows-static `
            liblzma:x86-windows-static

      - name: Build DirectX client
        working-directory: vc16
        run: |
          MSBuild otclient.sln /property:Configuration=DirectX /p:BUILD_REVISION=${{ github.run_number }}

      - name: Build OpenGL client
        working-directory: vc16
        run: |
          MSBuild otclient.sln /property:Configuration=OpenGL /p:BUILD_REVISION=${{ github.run_number }}

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: OTCv8-Stack64-Windows
          path: |
            otclient_dx.exe
            otclient_gl.exe
            *.dll
          if-no-files-found: error
